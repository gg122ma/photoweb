<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Photo · 视觉画廊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300&family=DM+Mono:wght@300;400&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    <style>
:root, [data-theme="dark"] {
    --bg: #08080a; --surface: #121216; --surface2: #1c1c22;
    --accent: #d4b87a; --accent-dim: rgba(212,184,122,.15); --accent-hover: #e8cc90;
    --text-primary: #f2efe9; --text-secondary: #9e9890; --text-dim: #605c56;
    --border: rgba(255,255,255,.08); --border-hover: rgba(255,255,255,.2);
    --nav-bg: rgba(8,8,10,.75); --overlay: rgba(0,0,0,.75);
    --danger: #e74c3c; --success: #2ecc71;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --shadow-sm: 0 4px 12px rgba(0,0,0,.2);
    --shadow-md: 0 10px 30px rgba(0,0,0,.4);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.6);
}
[data-theme="light"] {
    --bg: #f9f7f3; --surface: #ffffff; --surface2: #f0ede6;
    --accent: #b8924a; --accent-dim: rgba(184,146,74,.12); --accent-hover: #96763a;
    --text-primary: #1a1816; --text-secondary: #6a6560; --text-dim: #9a9590;
    --border: rgba(0,0,0,.08); --border-hover: rgba(0,0,0,.18);
    --nav-bg: rgba(249,247,243,.8); --overlay: rgba(255,255,255,.6);
    --danger: #c0392b; --success: #27ae60;
    --shadow-sm: 0 4px 12px rgba(0,0,0,.05);
    --shadow-md: 0 10px 30px rgba(0,0,0,.08);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text-primary); font-family: 'Noto Sans SC', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; transition: background-color 0.4s ease, color 0.4s ease; }
a { color: inherit; text-decoration: none; }

/* 滚动条美化 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* NAV */
.main-nav { position: fixed; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); z-index: 900; transition: all 0.4s ease; box-shadow: 0 2px 20px rgba(0,0,0,0.05); }
.nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 500; letter-spacing: .1em; color: var(--text-primary); cursor: pointer; transition: color .3s var(--ease); user-select: none; }
.nav-brand:hover { color: var(--accent); text-shadow: 0 0 15px var(--accent-dim); }
#navCenter { display: flex; gap: .8rem; align-items: center; }
.nav-right { display: flex; align-items: center; gap: .6rem; }
.nav-dd { position: relative; }
.nav-trigger { background: transparent; border: 1px solid transparent; color: var(--text-secondary); font-family: 'DM Mono', monospace; font-size: .7rem; letter-spacing: .08em; padding: .5rem 1rem; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: .4rem; transition: all .3s var(--ease); }
.nav-trigger:hover { background: var(--surface2); color: var(--text-primary); }
.nav-trigger svg { width: 10px; height: 10px; transition: transform .3s var(--ease); }
.nav-dd[data-year="2026"] .nav-trigger { font-weight: 500; color: var(--accent); border: 1px solid var(--accent-dim); }
.nav-dd[data-year="2026"] .nav-trigger:hover { background: var(--accent-dim); border-color: var(--accent); box-shadow: 0 0 15px var(--accent-dim); }
.nav-dd.open .nav-trigger { background: var(--surface2); color: var(--text-primary); }
.nav-dd.open .nav-trigger svg { transform: rotate(180deg); }
.dd-panel { position: absolute; top: calc(100% + 12px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: .8rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: .4rem; min-width: 260px; opacity: 0; visibility: hidden; transform: translateY(-10px) scale(0.98); transition: all .4s var(--ease); box-shadow: var(--shadow-lg); z-index: 100; backdrop-filter: blur(10px); }
.nav-dd.open .dd-panel { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
.dd-month { background: none; border: none; color: var(--text-dim); font-family: 'Noto Sans SC', sans-serif; font-size: .75rem; padding: .6rem .8rem; border-radius: 8px; cursor: default; transition: all .2s; }
.dd-month.has-data { color: var(--text-secondary); cursor: pointer; }
.dd-month.has-data:hover { background: var(--accent-dim); color: var(--accent); transform: scale(1.05); }

.nav-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); font-family: 'DM Mono', monospace; font-size: .65rem; letter-spacing: .06em; padding: .5rem .8rem; border-radius: 30px; cursor: pointer; transition: all .3s var(--ease); display: flex; align-items: center; gap: .4rem; }
.nav-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.nav-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.user-chip { padding: .35rem .7rem .35rem .35rem; gap: .55rem; max-width: 210px; }
.user-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-hover); background: var(--surface2); flex-shrink: 0; }
.user-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 145px; }
.lang-dd { position: relative; }
.lang-panel { position: absolute; top: calc(100% + 12px); right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: .5rem; min-width: 110px; opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all .4s var(--ease); box-shadow: var(--shadow-lg); z-index: 100; }
.lang-dd.open .lang-panel { opacity: 1; visibility: visible; transform: translateY(0); }
.lang-opt { display: block; width: 100%; background: none; border: none; color: var(--text-secondary); font-family: 'DM Mono', monospace; font-size: .7rem; padding: .5rem .8rem; border-radius: 6px; cursor: pointer; text-align: left; transition: all .2s; }
.lang-opt:hover { background: var(--accent-dim); color: var(--accent); padding-left: 1rem; }
.lang-opt.active { color: var(--accent); font-weight: bold; }

/* HOMEPAGE SLIDER */
.home-slider { position: relative; width: 100%; height: 100vh; overflow: hidden; cursor: grab; }
.home-slider:active { cursor: grabbing; }
.slider-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.5s var(--ease); z-index: 0; }
.slider-slide.active { opacity: 1; z-index: 1; }
.slider-slide .slide-bg { position: absolute; inset: -5%; width: 110%; height: 110%; object-fit: cover; will-change: transform; filter: saturate(1.1) contrast(1.05); }
.slider-slide.active .slide-bg { animation: kenBurns 12s ease-out forwards; }
.slider-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.1) 0%, rgba(0,0,0,.3) 50%, rgba(0,0,0,.9) 100%); z-index: 2; }
[data-theme="light"] .slider-overlay { background: linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.3) 50%, rgba(255,255,255,.9) 100%); }
.slider-content { position: absolute; bottom: 15%; left: 8%; z-index: 3; max-width: 800px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.slider-title { font-family: 'Cormorant Garamond', serif; font-size: 4rem; font-weight: 300; line-height: 1.1; margin-bottom: 1rem; opacity: 0; transform: translateY(30px); transition: all 1s var(--ease) .4s; }
.slider-slide.active .slider-title { opacity: 1; transform: translateY(0); }
.slider-meta { font-family: 'DM Mono', monospace; font-size: .85rem; color: var(--accent); letter-spacing: .2em; opacity: 0; transform: translateY(20px); transition: all .8s var(--ease) .6s; text-transform: uppercase; }
.slider-slide.active .slider-meta { opacity: 1; transform: translateY(0); }
.slider-dots { position: absolute; bottom: 3.5rem; left: 8%; display: flex; gap: .6rem; z-index: 4; }
.slider-dot { width: 12px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.3); border: none; cursor: pointer; transition: all .4s var(--ease); padding: 0; }
.slider-dot.active { background: var(--accent); width: 36px; box-shadow: 0 0 10px var(--accent-dim); }
[data-theme="light"] .slider-dot { background: rgba(0,0,0,.2); }
[data-theme="light"] .slider-dot.active { background: var(--accent); }
.slider-progress { position: absolute; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 5; transition: width .3s linear; width: 0; box-shadow: 0 0 10px var(--accent); }
.slider-hint { position: absolute; bottom: 4rem; right: 4%; z-index: 4; font-family: 'DM Mono', monospace; font-size: .6rem; color: #fff; letter-spacing: .15em; writing-mode: vertical-rl; opacity: .6; animation: bounceHint 2s infinite; }

@keyframes bounceHint { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
@keyframes kenBurns { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

/* BREADCRUMB & EMPTY */
.empty { text-align: center; padding: 80px 20px; color: var(--text-dim); }
.page-enter { opacity: 0; animation: fadeUp .6s var(--ease) forwards; }
.breadcrumb { padding: calc(64px + 2rem) 3rem 1rem; max-width: 1500px; margin: 0 auto; font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--text-dim); display: flex; align-items: center; gap: .6rem; }
.breadcrumb a { color: var(--text-secondary); transition: color .3s; }
.breadcrumb a:hover { color: var(--accent); }
.breadcrumb .sep { color: var(--border-hover); }

/* MONTH LAYOUT */
.month-layout { display: flex; max-width: 1500px; margin: 0 auto; padding: 0 3rem; min-height: calc(100vh - 64px); gap: 4rem; }
.month-left { flex: 1; max-width: 400px; padding: 2rem 0 0 0; display: flex; flex-direction: column; position: sticky; top: 64px; height: calc(100vh - 64px); }
.month-back { display: inline-flex; align-items: center; gap: .5rem; font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--text-secondary); letter-spacing: .1em; cursor: pointer; transition: all .3s; margin-bottom: 3rem; width: fit-content; padding: 0.5rem 1rem; border-radius: 30px; border: 1px solid var(--border); }
.month-back:hover { background: var(--surface); color: var(--text-primary); border-color: var(--border-hover); transform: translateX(-5px); }
.month-back svg { stroke: currentColor; width: 14px; height: 14px; }
.month-title { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; font-weight: 300; letter-spacing: 0; line-height: 1.1; margin-bottom: 1rem; }
.month-count { font-family: 'DM Mono', monospace; font-size: .8rem; color: var(--accent); letter-spacing: .1em; padding: 0.3rem 0.8rem; background: var(--accent-dim); border-radius: 20px; display: inline-block; }

.gal-info-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 2.5rem; background: var(--surface); border-radius: 24px; border: 1px solid var(--border); margin: auto 0 2rem; opacity: 0; animation: fadeUp .8s var(--ease) .3s forwards; box-shadow: var(--shadow-sm); }
.gal-info-eyebrow { font-family: 'DM Mono', monospace; font-size: .6rem; color: var(--accent); letter-spacing: .2em; display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem; transition: opacity .4s var(--ease), transform .4s var(--ease); }
.gal-info-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.gal-info-eyebrow.sliding-out { opacity: 0; transform: translateY(-5px); }
.gal-info-eyebrow.sliding-in { opacity: 0; transform: translateY(5px); }
.gal-info-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 500; margin-bottom: .5rem; line-height: 1.2; transition: opacity .4s var(--ease), transform .4s var(--ease); }
.gal-info-title.sliding-out { opacity: 0; transform: translateY(-8px); }
.gal-info-title.sliding-in { opacity: 0; transform: translateY(8px); }
.gal-info-date { font-family: 'DM Mono', monospace; font-size: .8rem; color: var(--text-secondary); margin-bottom: 1.5rem; transition: opacity .4s var(--ease) .03s, transform .4s var(--ease) .03s; }
.gal-info-date.sliding-out { opacity: 0; transform: translateY(-6px); }
.gal-info-date.sliding-in { opacity: 0; transform: translateY(6px); }
.gal-info-people { font-family: 'Noto Sans SC', sans-serif; font-size: .75rem; color: var(--text-primary); margin-bottom: .8rem; transition: opacity .4s var(--ease); font-weight: 500;}
.gal-info-desc { font-size: .85rem; color: var(--text-secondary); line-height: 1.8; margin-bottom: 1.5rem; transition: opacity .4s var(--ease); font-weight: 300; }
.gal-info-equip { display: flex; align-items: center; gap: .6rem; font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--text-dim); letter-spacing: .05em; transition: opacity .4s var(--ease); padding-top: 1rem; border-top: 1px dashed var(--border); }
.gal-info-equip svg { width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 1.5; flex-shrink: 0; }
.gal-info-hint { font-family: 'DM Mono', monospace; font-size: .6rem; color: var(--text-dim); letter-spacing: .15em; text-transform: uppercase; margin-top: 1.5rem; opacity: .5; }

/* MONTH RIGHT */
.month-right { flex: 2; padding-top: 2rem; border-left: 1px solid transparent; min-width: 0; display: flex; flex-direction: column; }
.gal-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 1rem 5rem 1rem; scroll-behavior: smooth; scroll-snap-type: y proximity; }
.gal-photo-list { display: flex; flex-direction: column; gap: 4rem; max-width: 800px; margin: 0 auto; padding-bottom: 100px; }
.gal-photo-card { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; cursor: pointer; scroll-snap-align: center; transition: all .6s var(--ease); opacity: 0; transform: translateY(40px); box-shadow: var(--shadow-md); background: var(--surface2); }
.gal-photo-card.visible { opacity: 1; transform: translateY(0); }
.gal-photo-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.gal-photo-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 40%); opacity: 0; transition: opacity 0.4s; }
.gal-photo-card .card-hover-tag { position: absolute; bottom: 1.5rem; right: 1.5rem; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 500; color: #fff; background: rgba(0,0,0,.4); backdrop-filter: blur(10px); padding: .5rem 1.2rem; border-radius: 30px; opacity: 0; transform: translateY(10px); transition: all .4s var(--ease); pointer-events: none; z-index: 2; border: 1px solid rgba(255,255,255,0.1); letter-spacing: .04em; }
.gal-photo-card:hover { transform: scale(1.02) translateY(-5px); box-shadow: var(--shadow-lg); z-index: 5; border-radius: 20px; }
.gal-photo-card:hover img { transform: scale(1.05); }
.gal-photo-card:hover::after { opacity: 1; }
.gal-photo-card:hover .card-hover-tag { opacity: 1; transform: translateY(0); }
.gal-photo-list.hovering .gal-photo-card:not(:hover) { filter: grayscale(0.8) brightness(0.4); transform: scale(0.98); }
.gal-photo-card.active-card { box-shadow: 0 0 0 2px var(--accent-dim), var(--shadow-md); }

/* DETAIL OVERLAY */
.detail-overlay { position: fixed; inset: 0; z-index: 2000; background: var(--bg); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .6s var(--ease); }
.detail-overlay.open { transform: translateX(0); }
.det-top-bar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; border-bottom: 1px solid var(--border); background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); flex-shrink: 0; z-index: 10; }
.det-back { display: flex; align-items: center; gap: .5rem; font-family: 'DM Mono', monospace; font-size: .75rem; color: var(--accent); cursor: pointer; background: rgba(212,184,122,0.1); border: 1px solid transparent; letter-spacing: .08em; transition: all .3s var(--ease); padding: 0.4rem 1rem; border-radius: 30px; }
.det-back:hover { background: var(--accent); color: var(--bg); opacity: 1; }
.det-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.det-cat { font-family: 'DM Mono', monospace; font-size: .6rem; color: var(--text-dim); letter-spacing: .2em; text-transform: uppercase; background: var(--surface2); padding: 0.4rem 1rem; border-radius: 20px; }
.det-body { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.det-hero { width: 100%; height: 65vh; position: relative; overflow: hidden; }
.det-hero img { width: 100%; height: 100%; object-fit: cover; animation: zoomIn 10s ease-out forwards; }
.det-hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(180deg, transparent, var(--bg)); }
@keyframes zoomIn { from {transform: scale(1);} to {transform: scale(1.05);} }
.det-content { padding: 0 2.5rem 3rem; max-width: 800px; margin: -5rem auto 0; width: 100%; position: relative; z-index: 2; text-align: center; }
.det-content h2 { font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 500; margin-bottom: .5rem; opacity: 0; transform: translateY(20px); transition: all .8s var(--ease) .3s; }
.detail-overlay.open .det-content h2 { opacity: 1; transform: translateY(0); }
.det-content .det-zh { font-family: 'DM Mono', monospace; font-size: .9rem; color: var(--accent); margin-bottom: 2rem; letter-spacing: .1em; opacity: 0; transform: translateY(15px); transition: all .8s var(--ease) .4s; }
.detail-overlay.open .det-content .det-zh { opacity: 1; transform: translateY(0); }
.det-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin-bottom: 2.5rem; opacity: 0; transition: opacity .6s var(--ease) .5s; }
.detail-overlay.open .det-tags { opacity: 1; }
.det-tags span { font-family: 'DM Mono', monospace; font-size: .65rem; color: var(--text-primary); background: var(--surface2); padding: .4rem 1rem; border: 1px solid var(--border); border-radius: 30px; letter-spacing: .05em; text-transform: uppercase; }
.det-quote { font-family: 'Noto Sans SC', sans-serif; font-style: normal; font-size: 1rem; font-weight: 300; line-height: 1.8; color: var(--text-secondary); padding: 2rem; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 2.5rem; opacity: 0; transform: translateY(15px); transition: all .8s var(--ease) .6s; text-align: left; box-shadow: var(--shadow-sm); }
.detail-overlay.open .det-quote { opacity: 1; transform: translateY(0); }
.det-desc { font-size: .9rem; line-height: 2; color: var(--text-secondary); font-weight: 300; opacity: 0; transition: opacity .6s var(--ease) .7s; text-align: left; }
.detail-overlay.open .det-desc { opacity: 1; }
.det-actions { display: flex; gap: 1rem; margin-top: 3rem; opacity: 0; transition: opacity .6s var(--ease) .8s; justify-content: center; }
.detail-overlay.open .det-actions { opacity: 1; }
.det-btn { flex: unset; min-width: 150px; padding: .8rem 1.5rem; border-radius: 30px; background: var(--surface); color: var(--text-primary); font-size: .75rem; letter-spacing: .08em; cursor: pointer; transition: all .3s var(--ease); display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.det-btn:hover { background: var(--surface2); border-color: var(--text-secondary); transform: translateY(-2px); color: var(--text-primary); }
.det-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; box-shadow: 0 4px 15px var(--accent-dim); }
.det-btn.primary:hover { background: var(--accent-hover); box-shadow: 0 6px 20px var(--accent-dim); color: #000; }
.det-btn svg { stroke: currentColor; width: 16px; height: 16px; }

/* DETAIL GALLERY */
.det-gallery { padding: 0 2.5rem 5rem; max-width: 1000px; margin: 0 auto; width: 100%; opacity: 0; transition: opacity .8s var(--ease) .9s; }
.detail-overlay.open .det-gallery { opacity: 1; }
.det-gallery-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.det-gallery-head h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; }
.det-gallery-head span { font-family: 'DM Mono', monospace; font-size: .7rem; color: var(--accent); background: var(--accent-dim); padding: 0.3rem 0.8rem; border-radius: 20px; letter-spacing: .08em; }
.det-gallery-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 1.5rem; row-gap: 1.5rem; align-items: start; padding-top: 1rem; }
.det-gal-item { break-inside: avoid; border-radius: 12px; overflow: hidden; cursor: zoom-in; position: relative; opacity: 0; transform: translateY(20px); transition: all .6s var(--ease); box-shadow: var(--shadow-sm); background: var(--surface2); }
.det-gal-item:nth-child(6n+2), .det-gal-item:nth-child(6n+5) { margin-top: 3.2rem; }
.det-gal-item:nth-child(6n+3) { margin-top: 1.4rem; }
.det-gal-item:nth-child(6n+4) { margin-top: -1rem; }
.det-gal-item:nth-child(4n+1) img { aspect-ratio: 4/5; object-fit: cover; }
.det-gal-item:nth-child(4n+2) img { aspect-ratio: 1/1; object-fit: cover; }
.det-gal-item:nth-child(4n+3) img { aspect-ratio: 5/4; object-fit: cover; }

let sliderIdx=0,sliderTouchX=0;
function renderHome(){
    const slides=HOME_SLIDES.length?HOME_SLIDES:SHOOTS.slice(0,5).map(s=>({image_url:s.cover,caption:s.title,sub:''}));
    if(!slides.length){app.innerHTML='<div class="empty" style="padding-top:200px"><p>'+t('noData')+'</p></div>';return}
    const slideHTML=slides.map((s,i)=>'<div class="slider-slide'+(i===0?' active':'')+'" data-index="'+i+'"><img class="slide-bg" src="'+s.image_url+'" alt="'+s.caption+'" draggable="false"><div class="slider-overlay"></div><div class="slider-content"><h1 class="slider-title">'+s.caption+'</h1><p class="slider-meta">'+s.sub+'</p></div></div>').join('');
    const dots=slides.map((_,i)=>'<button class="slider-dot'+(i===0?' active':'')+'" data-index="'+i+'"></button>').join('');
    app.innerHTML='<div class="home-slider" id="homeSlider"><div class="slider-progress" id="sliderProgress"></div>'+slideHTML+'<div class="slider-dots">'+dots+'</div><div class="slider-hint">SCROLL ↓</div></div><div class="home-disclaimer">如果发现照片有点怪，那只表明该相册还未整理</div>';

    const dotEls=sliderEl.querySelectorAll('.slider-dot');
    const progEl=document.getElementById('sliderProgress');
    function goSlide(idx){sliderIdx=(idx+slides.length)%slides.length;slideEls.forEach((s,i)=>s.classList.toggle('active',i===sliderIdx));dotEls.forEach((d,i)=>d.classList.toggle('active',i===sliderIdx));progEl.style.transition='none';progEl.style.width='0%';requestAnimationFrame(()=>{progEl.style.transition='width 10s linear';progEl.style.width='100%'})}
    dotEls.forEach(d=>d.addEventListener('click',()=>{goSlide(+d.dataset.index);resetAuto()}));
    sliderEl.addEventListener('touchstart',e=>{sliderTouchX=e.changedTouches[0].screenX},{passive:true});
    sliderEl.addEventListener('touchend',e=>{const diff=sliderTouchX-e.changedTouches[0].screenX;if(Math.abs(diff)>50){goSlide(sliderIdx+(diff>0?1:-1));resetAuto()}},{passive:true});
    function resetAuto(){clearInterval(homeSliderTimer);homeSliderTimer=setInterval(()=>goSlide(sliderIdx+1),10000)}
    resetAuto();goSlide(0)
}

    const gi=shoot.galleryImages||[];
    if(gi.length){
        gal.innerHTML='<div class="det-gallery-head"><h3>'+t('galleryTitle')+'</h3><span>'+gi.length+' '+t('photos')+'</span></div><div class="det-gallery-grid">'+gi.map((url,i)=>'<div class="det-gal-item" data-idx="'+i+'"><img src="'+url+'" alt="" loading="lazy"></div>').join('')+'</div>';
        requestAnimationFrame(()=>{
            const items=gal.querySelectorAll('.det-gal-item');
            items.forEach((item,i)=>{setTimeout(()=>item.classList.add('vis'),800+i*80);item.addEventListener('click',()=>openLB(gi,i))})
        })
    }else{
        gal.innerHTML='<div class="det-gallery-head"><h3>'+t('galleryTitle')+'</h3></div><div class="det-gallery-empty">'+t('noGallery')+'</div>'
    }
    detOverlay.classList.add('open');document.body.style.overflow='hidden'
}

/* FIX: closeDet navigates back to parent month page to prevent black screen */
function closeDet(){
    if(!detOverlay.classList.contains('open'))return;
    detOverlay.classList.remove('open');
    document.body.style.overflow='';
    const hm=location.hash.match(/^#\/shoot\/(.+)$/);
    if(hm){const s=shootBySlug(hm[1]);location.hash=s?'#/month/'+s.year+'/'+s.month:'#/'}
}

document.getElementById('detBack').addEventListener('click',closeDet);
document.getElementById('detCloseBtn').addEventListener('click',closeDet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLB();closeDet()}});

function renderDetail(slug){
    const s=shootBySlug(slug);
    if(!s){app.innerHTML='<div class="empty page-enter" style="padding-top:140px"><p>'+t('notFound')+'</p></div>';return}
    app.innerHTML='';openDet(s)
}

/* ADMIN */
function renderAdmin(){if(!currentUser){app.innerHTML='<div class="empty page-enter" style="padding-top:140px"><p>'+t('pleaseLogin')+'</p></div>';return}if(!isAdmin){app.innerHTML='<div class="empty page-enter" style="padding-top:140px"><p>'+t('noPermission')+'</p></div>';return}app.innerHTML='<div class="admin-wrap page-enter"><div class="admin-header"><h1>'+t('adminPanel')+'</h1><div class="admin-toolbar"><span class="sel-count" id="selCount"></span><button class="a-btn" id="aNew">+ '+t('newShoot')+'</button><button class="a-btn" id="aBatchCover">☁ '+t('batchCover')+'</button><button class="a-btn danger" id="aBatchDel">✕ '+t('batchDel')+'</button></div></div>'
+'<div style="margin-bottom:2rem;padding:1.5rem;background:var(--surface2);border-radius:16px;border:1px solid var(--border)">'
+'<div style="font-family:\'DM Mono\',monospace;font-size:.65rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:.4rem"><span style="width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block"></span>首页幻灯片管理</div>'
+'<div id="homeSlidesAdmin" style="display:flex;flex-direction:column;gap:.8rem"></div>'
+'<button class="a-btn" id="aAddSlide" style="margin-top:1rem">+ 添加幻灯片</button>'
+'</div>'
+'<table class="admin-table"><thead><tr><th><input type="checkbox" id="aSelAll"></th><th>'+t('cover')+'</th><th>'+t('titleLabel')+'</th><th>'+t('dateLabel')+'</th><th>'+t('equipLabel')+'</th><th>'+t('galleryPhotos')+'</th><th>'+t('edit')+'</th></tr></thead><tbody id="aTbody"></tbody></table></div>';
renderAdminRows();renderHomeSlidesAdmin();
document.getElementById('aSelAll').addEventListener('change',e=>{document.querySelectorAll('.a-chk').forEach(c=>c.checked=e.target.checked);updSel()});
document.getElementById('aNew').addEventListener('click',()=>openEdit(null));
document.getElementById('aBatchDel').addEventListener('click',batchDel);
document.getElementById('aBatchCover').addEventListener('click',batchCov);
document.getElementById('aAddSlide').addEventListener('click',()=>openSlideEdit(null))}
function renderAdminRows(){const tb=document.getElementById('aTbody');tb.innerHTML=SHOOTS.map(s=>'<tr data-slug="'+s.slug+'"><td><input type="checkbox" class="a-chk" data-slug="'+s.slug+'"></td><td><img class="th" src="'+s.cover+'" alt=""></td><td>'+s.title+'</td><td style="font-family:\'DM Mono\',monospace;font-size:.7rem;color:var(--text-secondary)">'+s.dateDisplay+'</td><td style="font-size:.75rem;color:var(--text-secondary)">'+s.equipment+'</td><td style="font-size:.7rem;color:var(--text-dim)">'+(s.galleryImages?s.galleryImages.length:0)+'</td><td><div style="display:flex;gap:.5rem"><button class="act-btn" data-act="edit" data-slug="'+s.slug+'">'+t('edit')+'</button><button class="act-btn del" data-act="del" data-slug="'+s.slug+'">'+t('delete')+'</button></div></td></tr>').join('');tb.querySelectorAll('.a-chk').forEach(c=>c.addEventListener('change',updSel));tb.querySelectorAll('[data-act="edit"]').forEach(b=>b.addEventListener('click',()=>openEdit(shootBySlug(b.dataset.slug))));tb.querySelectorAll('[data-act="del"]').forEach(b=>b.addEventListener('click',()=>{if(!confirm(t('confirmDel')))return;SHOOTS=SHOOTS.filter(s=>s.slug!==b.dataset.slug);saveShoots();refreshSite()}))}
function getSel(){return[...document.querySelectorAll('.a-chk:checked')].map(c=>c.dataset.slug)}
function updSel(){const n=getSel(),el=document.getElementById('selCount');if(el)el.textContent=n.length?n.length+' '+t('selected'):''}
function batchDel(){const sl=getSel();if(!sl.length||!confirm(sl.length+' '+t('confirmDel')))return;SHOOTS=SHOOTS.filter(s=>!sl.includes(s.slug));saveShoots();refreshSite()}
function batchCov(){const sl=getSel();if(!sl.length)return;openCldUpload(url=>{SHOOTS=SHOOTS.map(s=>sl.includes(s.slug)?{...s,cover:url,images:[url]}:s);saveShoots();refreshSite()})}

/* HOME SLIDES ADMIN */
function renderHomeSlidesAdmin(){
    const el=document.getElementById('homeSlidesAdmin');if(!el)return;
    if(!HOME_SLIDES.length){el.innerHTML='<div style="font-size:.75rem;color:var(--text-dim);font-family:\'DM Mono\',monospace">暂无幻灯片，点击下方按钮添加</div>';return}
    el.innerHTML=HOME_SLIDES.map((s,i)=>'<div style="display:flex;align-items:center;gap:1rem;padding:.8rem;background:var(--surface);border:1px solid var(--border);border-radius:12px"><img src="'+s.image_url+'" style="width:100px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0"><div style="flex:1;min-width:0"><div style="font-size:.85rem;color:var(--text-primary);margin-bottom:.3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(s.caption||'(无标题)')+'</div><div style="font-size:.7rem;color:var(--text-dim);font-family:\'DM Mono\',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(s.sub||'')+'</div></div><div style="display:flex;gap:.5rem;flex-shrink:0">'+(i>0?'<button class="act-btn" data-slidemove="up" data-idx="'+i+'">↑</button>':'')+(i<HOME_SLIDES.length-1?'<button class="act-btn" data-slidemove="down" data-idx="'+i+'">↓</button>':'')+'<button class="act-btn" data-slideedit="'+i+'">编辑</button><button class="act-btn del" data-slidedel="'+i+'">删除</button></div></div>').join('');
    el.querySelectorAll('[data-slideedit]').forEach(b=>b.addEventListener('click',()=>openSlideEdit(+b.dataset.slideedit)));
    el.querySelectorAll('[data-slidedel]').forEach(b=>b.addEventListener('click',()=>{const idx=+b.dataset.slidedel;if(!confirm('确认删除该幻灯片？'))return;HOME_SLIDES.splice(idx,1);saveHomeSlides();renderHomeSlidesAdmin()}));
    el.querySelectorAll('[data-slidemove]').forEach(b=>b.addEventListener('click',()=>{const idx=+b.dataset.idx,dir=b.dataset.slidemove,swapIdx=dir==='up'?idx-1:idx+1;[HOME_SLIDES[idx],HOME_SLIDES[swapIdx]]=[HOME_SLIDES[swapIdx],HOME_SLIDES[idx]];saveSlideOrder();renderHomeSlidesAdmin()}));
}
function saveSlideOrder(){HOME_SLIDES=HOME_SLIDES.map((s,i)=>({...s,sort_order:i}));saveHomeSlides()}
function openSlideEdit(idx){
    const s=idx!==null?HOME_SLIDES[idx]:null;
    const overlay=document.createElement('div');
    overlay.className='edit-overlay active';
    overlay.style.cssText='position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:3000;backdrop-filter:blur(8px)';
    overlay.innerHTML='<div class="edit-box">'
    +'<h2 style="font-family:\'Cormorant Garamond\',serif;font-size:1.8rem;font-weight:500;margin-bottom:1.5rem">'+(s?'编辑幻灯片':'新增幻灯片')+'</h2>'
    +'<div style="margin-bottom:1.5rem"><div class="edit-cover-area" id="slideImgArea" style="aspect-ratio:16/9;margin-bottom:1rem;position:relative">'
    +'<img id="slideImgPreview" src="'+(s?s.image_url:'')+'" style="width:100%;height:100%;object-fit:cover;display:'+(s?'block':'none')+'">'
    +'<div class="cover-empty" id="slideImgEmpty" style="display:'+(s?'none':'flex')+'"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><path d="M21 15l-5-5L5 21" stroke="currentColor"/></svg>点击上传图片</div>'
    +'</div>'
    +'<div class="edit-cover-actions"><button class="upload-btn" id="slideUploadBtn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>上传图片</button><button class="upload-btn" id="slideUrlToggle"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>粘贴链接</button></div>'
    +'<div id="slideUrlGroup" style="display:none;margin-top:.8rem"><input class="form-input" id="slideUrlInput" placeholder="图片 URL" value="'+(s?s.image_url:'')+'"></div></div>'
    +'<div class="form-group"><label class="form-label">标题文字</label><input class="form-input" id="slideCaptionInput" value="'+(s?s.caption:'')+'" placeholder="首页幻灯片标题"></div>'
    +'<div class="form-group"><label class="form-label">副标题</label><input class="form-input" id="slideSubInput" value="'+(s?s.sub:'')+'" placeholder="副标题（可选）"></div>'
    +'<div class="edit-actions">'
    +'<button class="a-btn" id="slideCancelBtn">取消</button>'
    +'<button class="a-btn" id="slideSaveBtn" style="background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:bold;">保存</button>'
    +'</div></div>';
    document.body.appendChild(overlay);
    let currentImgUrl=s?s.image_url:'';
    overlay.querySelector('#slideImgArea').addEventListener('click',()=>openCldUpload(url=>{currentImgUrl=url;overlay.querySelector('#slideImgPreview').src=url;overlay.querySelector('#slideImgPreview').style.display='block';overlay.querySelector('#slideImgEmpty').style.display='none';overlay.querySelector('#slideUrlInput').value=url}));
    overlay.querySelector('#slideUploadBtn').addEventListener('click',()=>openCldUpload(url=>{currentImgUrl=url;overlay.querySelector('#slideImgPreview').src=url;overlay.querySelector('#slideImgPreview').style.display='block';overlay.querySelector('#slideImgEmpty').style.display='none';overlay.querySelector('#slideUrlInput').value=url}));
    overlay.querySelector('#slideUrlToggle').addEventListener('click',()=>{const g=overlay.querySelector('#slideUrlGroup');g.style.display=g.style.display==='none'?'block':'none'});
    overlay.querySelector('#slideUrlInput').addEventListener('input',function(){currentImgUrl=this.value;overlay.querySelector('#slideImgPreview').src=this.value;overlay.querySelector('#slideImgPreview').style.display=this.value?'block':'none';overlay.querySelector('#slideImgEmpty').style.display=this.value?'none':'flex'});
    overlay.querySelector('#slideCancelBtn').addEventListener('click',()=>overlay.remove());
    overlay.querySelector('#slideSaveBtn').addEventListener('click',()=>{
        const imgUrl=currentImgUrl||overlay.querySelector('#slideUrlInput').value.trim();
        const caption=overlay.querySelector('#slideCaptionInput').value.trim();
        const sub=overlay.querySelector('#slideSubInput').value.trim();
        if(!imgUrl)return;
        if(idx!==null)HOME_SLIDES[idx]={...HOME_SLIDES[idx],image_url:imgUrl,caption,sub};
        else HOME_SLIDES.push({id:'slide-'+Date.now(),image_url:imgUrl,caption,sub,sort_order:HOME_SLIDES.length});
        saveSlideOrder();
        overlay.remove();renderHomeSlidesAdmin();router();
    });
    overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
}

/* EDIT MODAL */
function openEdit(shoot){
    const isNew=!shoot;
    document.getElementById('editTitle').textContent=isNew?t('newShootTitle'):t('editShootTitle');
    document.getElementById('editOrigSlug').value=shoot?shoot.slug:'';
    document.getElementById('editSlug').value=shoot?shoot.slug:'';
    document.getElementById('editSlug').readOnly=!isNew;
    document.getElementById('editTitleInput').value=shoot?shoot.title:'';
    document.getElementById('editDateInput').value=shoot?shoot.date:'';
    document.getElementById('editDescInput').value=shoot?shoot.description||'':'';
    document.getElementById('editPeopleInput').value=shoot?shoot.people.join(', '):'';
    document.getElementById('editEquipInput').value=shoot?shoot.equipment||'':'';
    document.getElementById('editDriveInput').value=shoot?shoot.drive||'':'';
    document.getElementById('editCoverInput').value=shoot?shoot.cover||'':'';
    document.getElementById('editCoverImg').src=shoot?shoot.cover:'';
    document.getElementById('coverEmpty').style.display=shoot&&shoot.cover?'none':'flex';
    document.getElementById('coverUrlGroup').style.display='none';
    editGalleryImages=shoot&&shoot.galleryImages?[...shoot.galleryImages]:[];
    renderEditGallery();updateI18n();
    document.getElementById('editOverlay').classList.add('active')
}
function renderEditGallery(){const el=document.getElementById('editGallery');el.innerHTML=editGalleryImages.map((url,i)=>'<div class="edit-gallery-thumb"><img src="'+url+'" alt=""><button class="edit-gallery-remove" data-idx="'+i+'">&times;</button></div>').join('');el.querySelectorAll('.edit-gallery-remove').forEach(b=>b.addEventListener('click',()=>{editGalleryImages.splice(+b.dataset.idx,1);renderEditGallery()}))}
document.getElementById('editCoverArea').addEventListener('click',()=>openCldUpload(url=>{document.getElementById('editCoverInput').value=url;document.getElementById('editCoverImg').src=url;document.getElementById('coverEmpty').style.display='none'}));
document.getElementById('editUploadBtn').addEventListener('click',()=>openCldUpload(url=>{document.getElementById('editCoverInput').value=url;document.getElementById('editCoverImg').src=url;document.getElementById('coverEmpty').style.display='none'}));
document.getElementById('editUrlToggle').addEventListener('click',()=>{const g=document.getElementById('coverUrlGroup');g.style.display=g.style.display==='none'?'block':'none';if(g.style.display==='block')document.getElementById('editCoverInput').focus()});
document.getElementById('editCoverInput').addEventListener('change',function(){document.getElementById('editCoverImg').src=this.value||DEFAULT_COVER;document.getElementById('coverEmpty').style.display=this.value?'none':'flex'});
document.getElementById('editGalleryAddBtn').addEventListener('click',()=>openCldUpload(url=>{editGalleryImages.push(url);renderEditGallery()},{multiple:true}));
document.getElementById('editCancelBtn').addEventListener('click',()=>document.getElementById('editOverlay').classList.remove('active'));
document.getElementById('editOverlay').addEventListener('click',e=>{if(e.target.id==='editOverlay')document.getElementById('editOverlay').classList.remove('active')});
document.getElementById('editSaveBtn').addEventListener('click',()=>{const orig=document.getElementById('editOrigSlug').value,slug=document.getElementById('editSlug').value.trim(),title=document.getElementById('editTitleInput').value.trim(),dateStr=document.getElementById('editDateInput').value,desc=document.getElementById('editDescInput').value.trim(),people=document.getElementById('editPeopleInput').value.split(',').map(s=>s.trim()).filter(Boolean),equip=document.getElementById('editEquipInput').value.trim(),drive=document.getElementById('editDriveInput').value.trim(),cover=document.getElementById('editCoverInput').value.trim();if(!slug||!title||!dateStr)return;const d=new Date(dateStr);const row=normalizeShoot({id:orig||slug,slug,title,date:dateStr,year:d.getFullYear(),month:d.getMonth()+1,description:desc,people,equipment:equip,drive,cover:cover||DEFAULT_COVER,galleryImages:editGalleryImages});if(orig){SHOOTS=SHOOTS.map(s=>s.slug===orig?row:s)}else{if(SHOOTS.some(s=>s.slug===slug)){alert('Slug already exists');return}SHOOTS=[row,...SHOOTS]}saveShoots();document.getElementById('editOverlay').classList.remove('active');refreshSite()});

/* INIT */
checkSession();
refreshSite();
</script>
</body>
</html>
